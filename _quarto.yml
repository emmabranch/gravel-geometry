project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - explore.qmd
    - compare.qmd
    - rider.qmd
    - design.qmd
    - epi.qmd
    - methods.qmd
  resources:
    - .nojekyll
    - data/gravel_geometry.csv
    - data/gravel_geometry_derived.csv
    - data/data_dictionary.csv
    - data/epi_agreement.csv
    - data/epi_agreement_summary.csv
    - data/epi_centiles.csv
    - data/epi_zscores.csv
    - data/epi_clusters.csv
    - data/epi_clusters_summary.csv
    - data/epi_pca_loadings.csv
    - data/epi_over_time.csv
    - data/epi_over_time_sizes.csv
    - data/epi_over_time_change.csv
    - data/gravel_geometry_history.csv
    - js/geometry.js
    - js/rider.js
    - js/draw.js
    - figures/hero-bikes.svg

website:
  title: "Gravel geometry explorer"
  site-url: https://emmabranch.github.io/gravel-geometry/
  repo-url: https://github.com/emmabranch/gravel-geometry
  description: "An interactive explorer of published gravel bike geometry: compare bikes, put a rider on them, and design your own."
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: explore.qmd
        text: Explore
      - href: compare.qmd
        text: Compare
      - href: rider.qmd
        text: Rider
      - href: design.qmd
        text: Design
      - href: epi.qmd
        text: Epi studies
      - href: methods.qmd
        text: Data and methods
    right:
      - icon: github
        href: https://github.com/emmabranch/gravel-geometry
        aria-label: Code on GitHub
  page-footer:
    center: "Independent project. Geometry figures are typed in from manufacturers' published charts and may change without notice. Not affiliated with or endorsed by any company named here."

format:
  html:
    theme: [flatly, brand, brand.scss, theme.scss]
    include-after-body: footer.html
    toc: false

execute:
  echo: false
  warning: false
  message: false
